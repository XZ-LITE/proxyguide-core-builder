name: Build ProxyGuide Cores (Xray & Mihomo)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-xray:
    name: Build Xray-core (libv2ray.aar)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: libv2ray/go.mod

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install Go Mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Download Go Dependencies
        run: |
          cd libv2ray
          go mod download
          go mod tidy

      - name: Build libv2ray.aar
        run: |
          mkdir -p output/libs
          cd libv2ray
          gomobile bind -v \
            -target=android \
            -androidapi 21 \
            -ldflags="-s -w -buildid=" \
            -trimpath \
            -o ../output/libs/libv2ray.aar \
            .

      - name: Upload Xray Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-core-aar
          path: output/libs/libv2ray.aar

  build-mihomo:
    name: Build Mihomo (libmihomo.so)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            goarch: arm64
            goarm: ""
            cc: aarch64-linux-android28-clang
          - arch: armeabi-v7a
            goarch: arm
            goarm: "7"
            cc: armv7a-linux-androideabi28-clang
          - arch: x86_64
            goarch: amd64
            goarm: ""
            cc: x86_64-linux-android28-clang

    steps:
      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Clone MetaCubeX/mihomo
        run: |
          git clone --depth 1 -b Alpha https://github.com/MetaCubeX/mihomo.git mihomo-src

      - name: Build libmihomo.so (${{ matrix.arch }})
        run: |
          cd mihomo-src
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="$TOOLCHAIN/bin/${{ matrix.cc }}"
          export CXX="$TOOLCHAIN/bin/${{ matrix.cc }}++"
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=${{ matrix.goarch }}
          if [ -n "${{ matrix.goarm }}" ]; then
            export GOARM=${{ matrix.goarm }}
          fi

          mkdir -p ../output/jniLibs/${{ matrix.arch }}
          go build -v -trimpath \
            -tags "with_gvisor" \
            -ldflags="-s -w -buildid= -X 'github.com/metacubex/mihomo/constant.Version=ProxyGuide-Custom'" \
            -o ../output/jniLibs/${{ matrix.arch }}/libmihomo.so \
            ./

      - name: Upload Mihomo Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-${{ matrix.arch }}
          path: output/jniLibs/${{ matrix.arch }}/libmihomo.so

  package-release:
    name: Package and Release Cores
    needs: [build-xray, build-mihomo]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Xray Artifact
        uses: actions/download-artifact@v4
        with:
          name: xray-core-aar
          path: release-bundle/libs

      - name: Download Mihomo arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: mihomo-arm64-v8a
          path: release-bundle/jniLibs/arm64-v8a

      - name: Download Mihomo armeabi-v7a
        uses: actions/download-artifact@v4
        with:
          name: mihomo-armeabi-v7a
          path: release-bundle/jniLibs/armeabi-v7a

      - name: Download Mihomo x86_64
        uses: actions/download-artifact@v4
        with:
          name: mihomo-x86_64
          path: release-bundle/jniLibs/x86_64

      - name: Create Zip Package
        run: |
          cd release-bundle
          sha256sum libs/libv2ray.aar > SHA256SUMS.txt
          sha256sum jniLibs/*/*.so >> SHA256SUMS.txt
          zip -r ../ProxyGuide-Cores.zip .
          cd ..

      - name: Generate Release Tag
        id: tag
        run: |
          TAG_NAME="cores-$(date +'%Y.%m.%d-%H%M')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "ProxyGuide Cores Release (${{ steps.tag.outputs.tag_name }})"
          body: |
            ### 🚀 ProxyGuide Custom Clean Cores
            
            Автоматическая чистая сборка Xray-core и Mihomo.
            
            - **libv2ray.aar**: Xray-core 1.8.24+ (VLESS Reality, Vision, XHTTP, FakeDNS, TLS Fragment)
            - **libmihomo.so**: Mihomo MetaCubeX (AmneziaWG, Hysteria 2, gVisor TCP/IP)
            
            #### 📦 Как установить в проект ProxyGuide:
            1. Скопируйте `libs/libv2ray.aar` в `app/libs/`
            2. Скопируйте папки `jniLibs/*` в `app/src/main/jniLibs/`
            3. Пересоберите APK!
          files: |
            ProxyGuide-Cores.zip
            release-bundle/libs/libv2ray.aar
            release-bundle/SHA256SUMS.txt
